<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#14202b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Terreno · Bitácora de visitas</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mut:#6b7280;--hd:#14202b;--ac:#ffc400;--acink:#1a1500;--bad:#c62828;--ok:#2e7d32;--line:#e5e7eb;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h2{margin:0 0 10px;font-size:20px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.bar{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.bar h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:transparent;border:0;color:inherit;font-size:22px;min-width:44px;height:44px;border-radius:10px}
.ib:active{background:#ffffff26}
.wrap{padding:12px;max-width:760px;margin:0 auto}
.wrap.dockpad{padding-bottom:110px}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:0 1px 2px #0001}
.btn{border:0;border-radius:12px;padding:12px 16px;background:#e5e7eb;font-weight:600;min-height:48px}
.btn:active{filter:brightness(.92)}
.btn.pri{background:var(--ac);color:var(--acink)}
.btn.dan{background:#fde8e8;color:var(--bad)}
.btn.blk{display:block;width:100%}
.row{display:flex;gap:8px;margin-top:16px}
.row>*{flex:1}
.row2{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.in{width:100%;border:1.5px solid #d1d5db;border-radius:10px;padding:12px;background:#fff;min-height:48px}
.in:focus{outline:none;border-color:#14202b}
textarea.in{min-height:120px;resize:vertical}
.mut{color:var(--mut);font-size:14px}
.vacio{text-align:center;color:var(--mut);padding:28px 12px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:#e5e7eb}
.badge.ok{background:#dcfce7;color:#166534}
.sev-Baja{background:#e0f2fe;color:#075985}.sev-Media{background:#fef9c3;color:#854d0e}.sev-Alta{background:#ffedd5;color:#9a3412}.sev-Crítica{background:#fee2e2;color:#991b1b}
/* contexto */
.ctx{background:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:10px;border-left:8px solid var(--ac);box-shadow:0 1px 2px #0001;cursor:pointer}
.ctx.falta{border-left-color:var(--bad)}
.ctx small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.ctx b{display:block;font-size:20px;line-height:1.2;margin-bottom:4px;overflow-wrap:anywhere}
.ctx .cambia{float:right;color:var(--mut);font-size:13px}
/* filtro */
.seg{display:flex;background:#e5e7eb;border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0002}
/* grupos y registros */
.gh{font-size:12px;font-weight:800;letter-spacing:.05em;color:#374151;margin:16px 4px 6px;text-transform:uppercase;overflow-wrap:anywhere}
.reg{display:flex;gap:10px;background:#fff;border-radius:12px;padding:8px;margin-bottom:6px;box-shadow:0 1px 2px #0001;cursor:pointer;align-items:center}
.reg:active{background:#f9fafb}
.th{width:64px;height:64px;border-radius:8px;background:#e5e7eb center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.reg .tx{flex:1;min-width:0}
.mic{flex:none;border:0;border-radius:50%;width:46px;height:46px;font-size:20px;background:#eef0f3}
.mic:active{background:var(--ac)}
.reg .t1{font-weight:600;overflow-wrap:anywhere}
.reg .t2{font-size:13px;color:var(--mut)}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.dock button{border:0;border-radius:14px;background:#eef0f3;padding:8px 0 6px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px}
.dock button span{font-size:24px;line-height:1}
.rec{text-align:center;padding:8px 0}
.rec .t{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.rec .p{display:inline-block;width:14px;height:14px;border-radius:50%;background:#e53935;margin-right:8px;animation:pp 1s infinite}
@keyframes pp{50%{opacity:.25}}
.dock button.main{background:var(--ac);color:var(--acink)}
.dock button:active{filter:brightness(.9)}
/* modal */
.mb{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet.full{height:100%;max-height:100%;max-width:none;border-radius:0;padding:0;background:#111;display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid #d1d5db;background:#fff;border-radius:99px;padding:8px 14px;font-size:15px;font-weight:600}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:14px 8px;font-size:17px;border-bottom:1px solid var(--line)}
.menu button.dan{color:var(--bad)}
.big{width:100%;max-height:42vh;object-fit:contain;background:#111;border-radius:10px;margin-bottom:6px}
details{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
summary{cursor:pointer;font-size:14px}
/* anotador */
.annbar{display:flex;gap:6px;padding:8px;background:#1f2937;align-items:center;flex-wrap:wrap}
.annbar button{border:0;border-radius:10px;background:#374151;color:#fff;padding:8px 10px;font-size:14px;font-weight:700;min-height:42px}
.annbar button.on{background:var(--ac);color:var(--acink)}
.annbar .col{width:34px;height:34px;min-height:0;padding:0;border-radius:99px;border:3px solid #fff4}
.annbar .col.on{border-color:#fff}
.annbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;position:relative;overflow:hidden;touch-action:none}
.zbtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:3}
.zbtns button{width:46px;height:46px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:24px;line-height:1;padding:0}
.annbox canvas{max-width:100%;max-height:100%;touch-action:none;background:#000;transform-origin:center}
.annbox img{transform-origin:center;user-select:none;-webkit-user-select:none}
/* toast */
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 16px;border-radius:99px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* informe */
.doc{background:#fff;padding:18px;border-radius:var(--r);box-shadow:0 1px 3px #0002}
.doc h1{font-size:22px;margin:0 0 8px}
.doc h2{font-size:18px;margin:22px 0 4px;border-bottom:2px solid #14202b;padding-bottom:3px}
.doc h3{font-size:15px;margin:14px 0 6px;color:#374151}
.doc table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.doc th,.doc td{border:1px solid #d1d5db;padding:5px 7px;text-align:left;vertical-align:top}
.doc th{background:#f3f4f6}
.doc td.n{text-align:right;white-space:nowrap}
.doc .meta td:first-child{width:30%;font-weight:700;background:#f3f4f6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.fig{break-inside:avoid;margin:0}
.fig img{width:100%;max-height:300px;object-fit:contain;background:#f3f4f6;border-radius:4px;display:block}
.fig figcaption{font-size:12px;color:#374151;margin-top:3px}
@media print{
  @page{margin:12mm}
  html,body{background:#fff}
  .no-print,.dock,#toast{display:none!important}
  .wrap{padding:0;max-width:none}
  .doc{box-shadow:none;padding:0;border-radius:0}
  .doc h2,.doc h3{break-after:avoid}
  .doc tr{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(self.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const pad2=n=>String(n).padStart(2,'0');
const fmtF=t=>{const d=new Date(t);return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()};
const fmtH=t=>{const d=new Date(t);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const fmtFH=t=>fmtF(t)+' '+fmtH(t);
const stamp=t=>{const d=new Date(t);return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'-'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds())};
const num=s=>{let t=String(s??'').trim();if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'');t=t.replace(',','.');return /^[-+]?(\d+(\.\d*)?|\.\d+)$/.test(t)?parseFloat(t):null};
const hay=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const catDe=(c,k)=>hay(c,k)&&Array.isArray(c[k])?c[k]:[];
const fmtN=(n,d=2)=>String(Math.round(n*10**d)/10**d).replace('.',',');
const lsGet=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const aj=()=>lsGet('aj',{});
const setAj=o=>lsSet('aj',{...aj(),...o});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
const ICO={foto:'📷',medida:'📏',nota:'📝',hallazgo:'⚠️',voz:'🎙️'};
const fmtDur=s=>Math.floor((s||0)/60)+':'+pad2(Math.floor((s||0)%60));
const SEV=['Baja','Media','Alta','Crítica'];
const UNIDADES=['mm','cm','m','in','kgf','kN','N·m','MPa','°'];
const PLANT0=['Largo','Ancho','Alto','Espesor','Diámetro','Distancia a borde','Separación','Flecha / deformación','Torque de apriete','Longitud de empotramiento','Inclinación'];

/* ============ base de datos (IndexedDB) ============ */
let db;
function abrirDB(){return new Promise((res,rej)=>{const r=indexedDB.open('terreno',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('visitas',{keyPath:'id'});d.createObjectStore('registros',{keyPath:'id'}).createIndex('visitaId','visitaId')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=n=>db.transaction(n).objectStore(n);
const put=(n,o)=>new Promise((res,rej)=>{const t=db.transaction(n,'readwrite');t.objectStore(n).put(o);t.oncomplete=()=>res(o);t.onerror=t.onabort=()=>rej(t.error)});
const del=(n,id)=>new Promise((res,rej)=>{const t=db.transaction(n,'readwrite');t.objectStore(n).delete(id);t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error)});
const getAll=n=>rq(st(n).getAll());
const regsDe=id=>rq(st('registros').index('visitaId').getAll(id));
const contar=id=>rq(st('registros').index('visitaId').count(id));
async function borrarVisita(id){const rs=await regsDe(id);return new Promise((res,rej)=>{const t=db.transaction(['visitas','registros'],'readwrite');t.objectStore('visitas').delete(id);rs.forEach(r=>t.objectStore('registros').delete(r.id));t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error)})}

/* ============ estado ============ */
const S={nivel:0,visita:null,regs:[],ctx:{sector:'',elemento:''},filtro:'todo',pos:null,urls:[],alFoto:null,instalar:null,offline:false};
const urlDe=b=>{const u=URL.createObjectURL(b);S.urls.push(u);return u};
const liberarUrls=()=>{S.urls.forEach(u=>URL.revokeObjectURL(u));S.urls=[]};
const app=()=>$('#app');

/* ============ modales + botón Atrás de Android ============ */
const modales=[];
function modal(html,{fuera=false,full=false}={}){
  const m=document.createElement('div');m.className='mb';
  m.innerHTML=`<div class="sheet${full?' full':''}">${html}</div>`;
  if(fuera)m.addEventListener('click',e=>{if(e.target===m)m.cerrar()});
  m.cerrar=()=>{const i=modales.indexOf(m);if(i>=0)modales.splice(i,1);m.remove()};
  m.$=s=>m.querySelector(s);
  modales.push(m);document.body.appendChild(m);return m}
function entrarNivel(){S.nivel++;history.pushState({n:S.nivel},'')}
addEventListener('popstate',()=>{
  if(modales.length){modales.pop().remove();history.pushState({n:S.nivel},'');return}
  if(S.nivel===2){S.nivel=1;renderVisita()}
  else if(S.nivel===1){S.nivel=0;renderHome()}
});

/* ============ ubicación GPS (opcional; bajo tierra no hay) ============ */
function actualizarPos(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{S.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()}},()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:120000})}
const posVigente=()=>S.pos&&Date.now()-S.pos.t<3*60e3?S.pos:null;

/* ============ imágenes ============ */
async function cargarImg(b){
  if(self.createImageBitmap){try{return await createImageBitmap(b,{imageOrientation:'from-image'})}catch(e){}}
  return new Promise((res,rej)=>{const u=URL.createObjectURL(b),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}
const aBlob=(c,q=.82)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
const dimsImg=i=>[i.width||i.naturalWidth,i.height||i.naturalHeight];
async function thumbDe(c){const k=Math.min(1,240/Math.max(c.width,c.height));const t=document.createElement('canvas');t.width=Math.round(c.width*k);t.height=Math.round(c.height*k);t.getContext('2d').drawImage(c,0,0,t.width,t.height);return aBlob(t,.7)}
function dibujarRotulo(x,w,h,lineas){
  const l=lineas.filter(Boolean);const fs=Math.max(14,Math.round(Math.max(w,h)/48));const p=Math.round(fs*.5);const bh=Math.round(l.length*fs*1.25+p*2);
  x.fillStyle='rgba(0,0,0,.62)';x.fillRect(0,h-bh,w,bh);x.fillStyle='#fff';x.textBaseline='top';
  l.forEach((t,i)=>{x.font=(i===0?'bold ':'')+fs+'px sans-serif';x.fillText(t,p,h-bh+p+i*fs*1.25,w-p*2)})}
async function procesarFoto(file,rotulo){
  const img=await cargarImg(file);const [w0,h0]=dimsImg(img);const k=Math.min(1,1600/Math.max(w0,h0));
  const c=document.createElement('canvas');c.width=Math.round(w0*k);c.height=Math.round(h0*k);
  const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
  if(rotulo)dibujarRotulo(x,c.width,c.height,rotulo);
  return {blob:await aBlob(c),thumb:await thumbDe(c)}}
function rotuloActual(){
  if(aj().rotular===false)return null;
  const p=posVigente(),c=S.ctx;
  return [c.sector+(c.elemento?' › '+c.elemento:''),fmtFH(Date.now())+' · '+S.visita.nombre,p?`${p.lat.toFixed(5)}, ${p.lng.toFixed(5)} (±${Math.round(p.acc)} m)`:'']}

/* ============ registros ============ */
function nuevoReg(tipo,extra={}){const p=posVigente();
  return {id:uid(),visitaId:S.visita.id,tipo,ts:Date.now(),sector:S.ctx.sector,elemento:S.ctx.elemento,lat:p?.lat,lng:p?.lng,acc:p?.acc,...extra}}
async function recargar(){S.regs=await regsDe(S.visita.id)}
function anotarCat(sec,ele){const c=S.visita.catalogo;if(!sec)return;
  if(!hay(c,sec)||!Array.isArray(c[sec]))Object.defineProperty(c,sec,{value:[],enumerable:true,writable:true,configurable:true});
  if(ele&&!c[sec].includes(ele))c[sec].push(ele)}
const delta=r=>{const a=num(r.valor),b=num(r.nominal);if(a===null||b===null)return null;const d=a-b;return {d,p:b!==0?d/b*100:null}};
const deltaTxt=r=>{const x=delta(r);if(!x)return '';return 'Δ '+(x.d>0?'+':'')+fmtN(x.d)+(x.p===null?'':` (${x.p>0?'+':''}${fmtN(x.p,1)} %)`)};

function conCtx(fn){if(!S.ctx.sector){abrirCtx(fn);return}fn()}

/* ---- captura de foto ---- */
function pedirFoto(){S.alFoto=null;conCtx(()=>{actualizarPos();$('#cam').click()})}
$('#cam').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length||!S.visita)return;
  const cb=S.alFoto;S.alFoto=null;
  let n=0,ultimo=null;
  for(const f of files){
    try{
      const r=await procesarFoto(f,rotuloActual());
      if(cb){await cb(r);return}
      const reg=nuevoReg('foto',{texto:'',blob:r.blob,thumb:r.thumb});
      await put('registros',reg);n++;ultimo=reg;
    }catch(err){toast('No se pudo guardar la foto');console.error(err)}
  }
  if(n){await recargar();renderVisita();toast(`📷 Guardada en ${S.ctx.sector}${S.ctx.elemento?' › '+S.ctx.elemento:''}`);
    if(n===1&&aj().vozFoto&&ultimo){const rr=S.regs.find(z=>z.id===ultimo.id);if(rr)grabarVoz({reg:rr})}}
});

/* ============ pantalla: inicio ============ */
async function renderHome(){
  S.nivel=0;S.visita=null;liberarUrls();
  const vs=(await getAll('visitas')).sort((a,b)=>b.fecha-a.fecha);
  const cnt=await Promise.all(vs.map(v=>contar(v.id)));
  let est='';
  try{if(navigator.storage?.estimate){const e=await navigator.storage.estimate();est=`Guardado en este teléfono: ${fmtN(e.usage/1048576,1)} MB`}}catch(e){}
  app().innerHTML=`
  <div class="bar"><h1>Terreno</h1>${S.offline?'<span class="badge ok">sin señal OK</span>':''}<button class="ib" data-a="menuHome" aria-label="Menú">⋮</button></div>
  <div class="wrap">
    <button class="btn pri blk" data-a="nuevaVisita" style="margin-bottom:12px;font-size:18px;min-height:56px">+ Nueva visita</button>
    ${vs.length?vs.map((v,i)=>`
      <div class="card" data-a="abrir" data-id="${esc(v.id)}" style="cursor:pointer">
        <div style="font-weight:700;font-size:17px;overflow-wrap:anywhere">${esc(v.nombre)}</div>
        <div class="mut">${esc(v.proyecto||'Sin proyecto')} · ${fmtF(v.fecha)}</div>
        <div class="mut">${cnt[i]} registro${cnt[i]===1?'':'s'} · ${Object.keys(v.catalogo||{}).length} sector${Object.keys(v.catalogo||{}).length===1?'':'es'}</div>
      </div>`).join(''):`<div class="vacio">Aún no tienes visitas.<br>Crea una y elige el sector antes de sacar fotos:<br>cada foto, medida y nota queda ligada a ese sector y elemento.</div>`}
    <div class="mut" style="text-align:center;margin-top:18px">${esc(est)}<br>Los datos viven solo en este teléfono. Haz respaldos de vez en cuando (menú ⋮).</div>
  </div>`;
}
function menuHome(){
  const m=modal(`<div class="menu">
    ${S.instalar?'<button data-m="inst">📲 Instalar app en el teléfono</button>':''}
    <button data-m="resp">💾 Respaldo de todas las visitas</button>
    <button data-m="imp">📂 Importar respaldo</button>
    <button data-m="perf">👤 Datos del responsable</button>
    <button data-m="x">Cerrar</button></div>`,{fuera:true});
  m.addEventListener('click',async e=>{const k=e.target.dataset?.m;if(!k)return;m.cerrar();
    if(k==='inst'){S.instalar.prompt();S.instalar=null}
    if(k==='resp')respaldo();
    if(k==='imp')$('#imp').click();
    if(k==='perf')formPerfil()})}
function formPerfil(){
  const a=aj();const m=modal(`<h2>Datos del responsable</h2>

/* ---- crear / editar visita ---- */
async function formVisita(v){
  const nueva=!v;const a=aj();
  const ult=nueva?(await getAll('visitas')).sort((x,y)=>y.fecha-x.fecha)[0]:null;
  const m=modal(`<h2>${nueva?'Nueva visita':'Datos de la visita'}</h2>
    <label>Nombre</label><input class="in" id="n" value="${esc(v?.nombre||'Visita '+fmtF(Date.now()))}">
    <label>Proyecto / faena</label><input class="in" id="p" value="${esc(v?.proyecto||ult?.proyecto||'')}">
    <label>Responsable</label><input class="in" id="r" value="${esc(v?.responsable??a.responsable??'')}">
    ${nueva&&ult&&Object.keys(ult.catalogo||{}).length?`<label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink);font-weight:500"><input type="checkbox" id="cp" checked style="width:22px;height:22px"> Copiar sectores de «${esc(ult.nombre)}»</label>`:''}
    <div class="row"><button class="btn" id="c">Cancelar</button><button class="btn pri" id="g">${nueva?'Crear':'Guardar'}</button></div>`);
  m.$('#c').onclick=()=>m.cerrar();
  m.$('#g').onclick=async()=>{
    const nombre=m.$('#n').value.trim();if(!nombre){toast('Ponle un nombre');return}
    if(m.ocupado)return;m.ocupado=true;
    if(nueva){
      const cat=m.$('#cp')?.checked?JSON.parse(JSON.stringify(ult.catalogo)):{};
      v={id:uid(),fecha:Date.now(),catalogo:cat,ctx:{sector:'',elemento:''}};
    }
    v.nombre=nombre;v.proyecto=m.$('#p').value.trim();v.responsable=m.$('#r').value.trim();
    setAj({responsable:v.responsable});
    await put('visitas',v);m.cerrar();
    try{navigator.storage?.persist?.()}catch(e){}
    if(nueva)await abrirVisita(v.id);else{S.visita=v;renderVisita()}
  }}

/* ============ pantalla: visita ============ */
async function abrirVisita(id){
  const v=(await rq(st('visitas').get(id)));if(!v)return;
  S.visita=v;v.catalogo=v.catalogo||{};S.ctx=v.ctx||{sector:'',elemento:''};S.filtro='todo';
  await recargar();entrarNivel();actualizarPos();renderVisita(true);
  if(!S.ctx.sector)setTimeout(()=>abrirCtx(),150)}
function filtrar(){
  const c=S.ctx;
  if(S.filtro==='sector')return S.regs.filter(r=>r.sector===c.sector);
  if(S.filtro==='elemento')return S.regs.filter(r=>r.sector===c.sector&&r.elemento===c.elemento);
  return S.regs}
function cardReg(r){
  let t1='',t2=fmtH(r.ts);
  if(r.tipo==='foto')t1=esc(r.texto||'Foto');
  else if(r.tipo==='medida'){t1=`${esc(r.etiqueta)}: <b>${esc(r.valor)} ${esc(r.unidad)}</b>`;const d=deltaTxt(r);t2+=` · nominal ${esc(r.nominal||'—')}${d?' · '+d:''}`;if(r.texto)t2+=' · '+esc(r.texto)}
  else if(r.tipo==='nota')t1=esc(r.texto);
  else if(r.tipo==='voz'){t1=esc(r.texto||'Nota de voz');t2+=' · '+fmtDur(r.dur)}
  else{t1=`<span class="badge sev-${esc(r.severidad)}">${esc(r.severidad)}</span> ${esc(r.texto)}`}
  if(r.audio&&r.tipo!=='voz')t2+=' · 🎙️ '+fmtDur(r.dur);
  const cs=cotasDe(r);if(cs.length)t2+=' · 📐 '+cs.join('; ');
  const th=r.thumb?`style="background-image:url(${urlDe(r.thumb)})"`:'';
  return `<div class="reg" data-a="reg" data-id="${esc(r.id)}"><div class="th" ${th}>${r.thumb?'':ICO[r.tipo]}</div><div class="tx"><div class="t1">${t1}</div><div class="t2">${ICO[r.tipo]} ${t2}</div></div>${r.blob&&!r.audio?`<button class="mic" data-a="vozreg" data-id="${esc(r.id)}" aria-label="Grabar audio de esta foto">🎙️</button>`:''}</div>`}
function renderVisita(reset){
  const v=S.visita;const y=reset?0:scrollY;liberarUrls();
  const c=S.ctx;const lista=filtrar();
  const g=new Map();
  for(const r of lista){const k=(r.sector||'(sin sector)')+'\u0001'+(r.elemento||'');if(!g.has(k))g.set(k,[]);g.get(k).push(r)}
  const grupos=[...g.entries()].map(([k,rs])=>({k,rs:rs.sort((a,b)=>b.ts-a.ts)})).sort((a,b)=>b.rs[0].ts-a.rs[0].ts);
  const nS=S.regs.filter(r=>r.sector===c.sector).length,nE=S.regs.filter(r=>r.sector===c.sector&&r.elemento===c.elemento).length;
  app().innerHTML=`
  <div class="bar"><button class="ib" data-a="volver" aria-label="Volver">←</button><h1>${esc(v.nombre)}</h1><button class="ib" data-a="menuVisita" aria-label="Menú">⋮</button></div>
  <div class="wrap dockpad">
    <div class="ctx${c.sector?'':' falta'}" data-a="ctx"><span class="cambia">cambiar ›</span>
      <small>SECTOR</small><b>${esc(c.sector||'Toca para elegir')}</b>
      <small>ELEMENTO</small><b style="margin:0">${esc(c.elemento||'—')}</b></div>
    <div class="seg">
      <button data-a="filtro" data-f="todo" class="${S.filtro==='todo'?'on':''}">Todo (${S.regs.length})</button>
      <button data-a="filtro" data-f="sector" class="${S.filtro==='sector'?'on':''}">Sector (${nS})</button>
      <button data-a="filtro" data-f="elemento" class="${S.filtro==='elemento'?'on':''}">Elemento (${nE})</button></div>
    ${grupos.length?grupos.map(({k,rs})=>{const [s,e]=k.split('\u0001');return `<div class="gh">${esc(s)}${e?' › '+esc(e):''}</div>`+rs.map(cardReg).join('')}).join(''):`<div class="vacio">Sin registros${S.filtro==='todo'?' todavía':' aquí'}.<br>Usa los botones de abajo.</div>`}
  </div>
  <div class="dock">
    <button class="main" data-a="foto"><span>📷</span>Foto</button>
    <button data-a="medida"><span>📏</span>Medida</button>
    <button data-a="nota"><span>📝</span>Nota</button>
    <button data-a="voz"><span>🎙️</span>Voz</button>
    <button data-a="hallazgo"><span>⚠️</span>Hallazgo</button></div>`;
  scrollTo(0,y)}

/* ---- elegir sector / elemento ---- */
function abrirCtx(cb){
  const v=S.visita;const cat=v.catalogo;
  const m=modal(`<h2>¿Dónde estás?</h2>
    <label>Sector</label><input class="in" id="cs" placeholder="Ej.: Chancado primario" value="${esc(S.ctx.sector)}" autocomplete="off">
    <div class="chips" id="chs"></div>
    <label>Elemento / estructura</label><input class="in" id="ce" placeholder="Ej.: Viga V-12, Anclaje A-3" value="${esc(S.ctx.elemento)}" autocomplete="off">
    <div class="chips" id="che"></div>
    <div class="row"><button class="btn" id="c">Cancelar</button><button class="btn pri" id="ok">Usar</button></div>`);
  const cs=m.$('#cs'),ce=m.$('#ce');
  const chip=(t,on,at)=>`<button type="button" class="chip${on?' on':''}" ${at}="${esc(t)}">${esc(t)}</button>`;
  const pintar=()=>{
    const s=cs.value.trim();
    m.$('#chs').innerHTML=Object.keys(cat).map(x=>chip(x,x===s,'data-s')).join('');
    m.$('#che').innerHTML=catDe(cat,s).map(x=>chip(x,x===ce.value.trim(),'data-e')).join('')};
  pintar();
  cs.addEventListener('input',pintar);ce.addEventListener('input',pintar);
  m.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
    if(b.dataset.s!==undefined){cs.value=b.dataset.s;ce.value='';ce.focus()}
    if(b.dataset.e!==undefined)ce.value=b.dataset.e;pintar()});
  m.$('#c').onclick=()=>m.cerrar();
  m.$('#ok').onclick=async()=>{
    const s=cs.value.trim(),e=ce.value.trim();if(!s){toast('Escribe o elige un sector');return}
    if(m.ocupado)return;m.ocupado=true;
    S.ctx={sector:s,elemento:e};S.visita.ctx=S.ctx;anotarCat(s,e);await put('visitas',S.visita);
    m.cerrar();renderVisita();if(cb)cb()};
}

  if(r.lat!=null)h+=`<div class="card" style="margin:8px 0;padding:10px"><div class="mut">📍 Ubicación GPS</div>
    <div id="coords" style="font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}</div>
    ${r.acc!=null?`<div class="mut">Precisión ±${Math.round(r.acc)} m</div>`:''}
    <div class="row" style="margin-top:8px"><button type="button" class="btn" id="gcopy">📋 Copiar</button>
    <a class="btn" id="gmap" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lat.toFixed(6)},${r.lng.toFixed(6)}" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit">🗺️ Ver en mapa</a></div>

  if(t==='foto'||t==='voz')h+=`<label>Leyenda (opcional)</label><input class="in" id="f_tx" value="${esc(r.texto)}" placeholder="Qué se ve en la foto">`;
  if(t==='medida')h+=`
    <label>Qué mediste</label><input class="in" id="f_et" list="pl" value="${esc(r.etiqueta)}" placeholder="Ej.: Espesor de placa" autocomplete="off"><datalist id="pl">${plant.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <div class="row2"><div><label>Medido</label><input class="in" id="f_val" inputmode="decimal" value="${esc(r.valor)}" placeholder="0"></div>
    <div><label>Unidad</label><select class="in" id="f_un">${UNIDADES.map(u=>`<option${u===r.unidad?' selected':''}>${esc(u)}</option>`).join('')}</select></div></div>
    <label>Valor nominal / de plano (opcional)</label><input class="in" id="f_nom" inputmode="decimal" value="${esc(r.nominal)}">
    <label>Observación (opcional)</label><input class="in" id="f_tx" value="${esc(r.texto)}">`;
  if(t==='nota')h+=`<label>Nota</label><textarea class="in" id="f_tx" placeholder="Escribe o usa el micrófono del teclado para dictar">${esc(r.texto)}</textarea>`;
  if(t==='hallazgo'){
    h+=`<label>Severidad</label><div class="chips" id="sevs">${SEV.map(s=>`<button type="button" class="chip${s===sev?' on':''}" data-sv="${s}">${s}</button>`).join('')}</div>

    ${r.blob?'':`<div id="pv"></div><button type="button" class="btn blk" id="f_foto" style="margin-top:8px">📷 Agregar foto</button>`}`}
  h+=`<details><summary>Ubicación: <b>${esc(r.sector)}${r.elemento?' › '+esc(r.elemento):''}</b></summary>
    <label>Sector</label><input class="in" id="f_sec" list="dsec" value="${esc(r.sector)}"><datalist id="dsec">${secs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <label>Elemento</label><input class="in" id="f_ele" list="dele" value="${esc(r.elemento)}"><datalist id="dele">${eles.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></details>`;

  if(!nuevo)h+=`<div class="row">${r.blob?`<button class="btn" id="ann">✏️ ${r.orig?'Editar anotaciones':'Anotar foto'}</button>`:''}${r.orig?'<button class="btn" id="qa">Quitar anotaciones</button>':''}<button class="btn dan" id="del">Eliminar</button></div>`;
  const m=modal(h);

    m.$('#f_et').addEventListener('change',()=>{const k=val('#f_et');const u=hay(uni,k)?uni[k]:'';if(UNIDADES.includes(u))m.$('#f_un').value=u})}

  const recoger=()=>{

    if(t==='medida'){
      const et=val('#f_et'),v=val('#f_val');

      if(val('#f_nom')&&num(val('#f_nom'))===null){toast('El valor nominal debe ser un número');return false}
      Object.assign(r,{etiqueta:et,valor:v,nominal:val('#f_nom'),unidad:m.$('#f_un').value,texto:val('#f_tx')});
      const pl=lsGet('plantillas',PLANT0);if(!pl.includes(et)){pl.push(et);lsSet('plantillas',pl)}
      setAj({ultUnidad:r.unidad,unidades:{...uni,[et]:r.unidad}})}
    else if(t==='foto'||t==='voz')r.texto=val('#f_tx');
    else{if(!val('#f_tx')){toast('Escribe una descripción');return false}r.texto=val('#f_tx');
      if(t==='hallazgo'){r.severidad=sev;if(pend){r.blob=pend.blob;r.thumb=pend.thumb}}}
    r.sector=sec;r.elemento=ele;return true};
  let ocupado=false;
  const guardar=async()=>{
    if(ocupado||!recoger())return false;
    ocupado=true;
    try{await put('registros',r);anotarCat(r.sector,r.elemento);await put('visitas',S.visita);await recargar();return true}
    finally{ocupado=false}};

  m.$('#c').onclick=()=>m.cerrar();
  m.$('#g').onclick=async()=>{if(await guardar()){m.cerrar();renderVisita();toast('Guardado')}};
  const go=m.$('#go');if(go)go.onclick=async()=>{if(await guardar()){m.cerrar();renderVisita();toast('Guardado · otra medida');nuevaMedida()}};
  const d=m.$('#del');if(d)d.onclick=async()=>{if(!confirm('¿Eliminar este registro?'))return;await del('registros',r.id);await recargar();m.cerrar();renderVisita();toast('Eliminado')};
  const av=m.$('#av');if(av)av.onclick=async()=>{if(!await guardar())return;m.cerrar();renderVisita();

  const qv=m.$('#qv');if(qv)qv.onclick=async()=>{if(!confirm('¿Quitar el audio de esta foto?'))return;delete r.audio;delete r.dur;await put('registros',r);await recargar();m.cerrar();renderVisita();toast('Audio quitado')};
  const an=m.$('#ann');if(an)an.onclick=async()=>{if(!await guardar())return;m.cerrar();renderVisita();anotar(r)};
  const qa=m.$('#qa');if(qa)qa.onclick=async()=>{
    r.blob=r.orig;delete r.orig;delete r.anot;delete r.fondo;r.thumb=await thumbDe(await canvasDe(r.blob));await put('registros',r);await recargar();m.cerrar();renderVisita();toast('Anotaciones quitadas')};
}
async function canvasDe(b){const i=await cargarImg(b);const [w,h]=dimsImg(i);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0);return c}
/* ---- notas de voz: sueltas (por sector) o ligadas a una foto (opts.reg) ---- */
function grabarVoz(opts={}){
  const iniciar=async()=>{
    if(!navigator.mediaDevices?.getUserMedia||!self.MediaRecorder){toast('Este navegador no puede grabar audio');return}
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
    catch(e){toast('Permite el uso del micrófono para grabar');return}
    const tipo=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    const mr=new MediaRecorder(stream,tipo?{mimeType:tipo}:{});
    const trozos=[];const t0=Date.now();let guardar=false,dur=0,porBoton=false,cancelado=false,wl=null;
    try{wl=await navigator.wakeLock?.request('screen')}catch(e){}
    mr.ondataavailable=e=>{if(e.data&&e.data.size)trozos.push(e.data)};
    mr.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());try{wl?.release()}catch(e){}
      const auto=!porBoton&&!cancelado;   // se cortó sola (p. ej. al salir de la app o bloquear la pantalla)
      if(auto){dur=(Date.now()-t0)/1000;guardar=true;clearInterval(iv);m.cerrar()}
      if(guardar&&trozos.length){
        try{const blob=new Blob(trozos,{type:mr.mimeType||tipo||'audio/webm'});
          if(opts.reg){opts.reg.audio=blob;opts.reg.dur=dur;await put('registros',opts.reg)}
          else await put('registros',nuevoReg('voz',{texto:'',audio:blob,dur}));
          await recargar();renderVisita();toast(auto?'La grabación se cortó; se guardó lo grabado':opts.reg?'🎙️ Audio guardado en la foto':'🎙️ Nota de voz guardada')}
        catch(e){toast('No se pudo guardar el audio')}}
      if(porBoton&&opts.alTerminar)opts.alTerminar()};
    const m=modal(`<h2>🎙️ ${opts.reg?'Audio de esta foto':'Grabando nota de voz'}</h2>
      ${opts.reg&&opts.reg.thumb?`<img class="big" style="max-height:130px" src="${urlDe(opts.reg.thumb)}" alt="">`:''}
      <div class="mut" style="text-align:center">${esc((opts.reg||S.ctx).sector)}${(opts.reg||S.ctx).elemento?' › '+esc((opts.reg||S.ctx).elemento):''}</div>
      <div class="rec"><span class="p"></span><span class="t" id="tm">0:00</span></div>
      <div class="row"><button class="btn" id="c">${opts.reg?'Omitir':'Cancelar'}</button><button class="btn pri" id="g">■ Detener y guardar</button></div>`);
    const fin=g=>{guardar=g;porBoton=true;dur=(Date.now()-t0)/1000;clearInterval(iv);if(mr.state!=='inactive')mr.stop();m.cerrar()};
    const iv=setInterval(()=>{
      if(!m.isConnected){guardar=false;cancelado=true;clearInterval(iv);if(mr.state!=='inactive')mr.stop();return}
      const x=(Date.now()-t0)/1000;m.$('#tm').textContent=fmtDur(x);if(x>=600)fin(true)},250);
    m.$('#c').onclick=()=>fin(false);
    m.$('#g').onclick=()=>fin(true);
    mr.start(1000)};
  if(opts.reg)iniciar();else conCtx(iniciar)}
function abrirReg(id){const r=S.regs.find(x=>x.id===id);if(r)formRegistro(r,false)}

/* ---- motor de zoom reutilizable: pellizco, arrastre, botones y rueda ---- */
function motorZoom(box,el){
  const z={s:1,x:0,y:0};let p0=null;
  const aplicar=()=>{el.style.transform=`translate(${z.x}px,${z.y}px) scale(${z.s})`};
  const base=()=>{const r=el.getBoundingClientRect();return {cx:r.left+r.width/2-z.x,cy:r.top+r.height/2-z.y,w:r.width/z.s,h:r.height/z.s}};
  const ini=()=>({s:z.s,x:z.x,y:z.y,...base()});
  const limitar=()=>{const b=base(),mx=b.w*z.s/2,my=b.h*z.s/2;z.x=Math.max(-mx,Math.min(mx,z.x));z.y=Math.max(-my,Math.min(my,z.y))};
  const poner=(s2,fx,fy,dx,dy,i)=>{   // zoom manteniendo fijo el punto (fx,fy) de la pantalla
    s2=Math.max(1,Math.min(8,s2));const k=s2/i.s;
    z.x=(fx-i.cx)-k*((fx-i.cx)-i.x)+dx;z.y=(fy-i.cy)-k*((fy-i.cy)-i.y)+dy;z.s=s2;
    if(s2<1.001){z.s=1;z.x=0;z.y=0}limitar();aplicar()};
  box.addEventListener('wheel',e=>{e.preventDefault();poner(z.s*Math.exp(-Math.max(-300,Math.min(300,e.deltaY))*.0015),e.clientX,e.clientY,0,0,ini())},{passive:false});
  return {z,
    zoom(f,fx,fy){const b=box.getBoundingClientRect();poner(z.s*f,fx??b.left+b.width/2,fy??b.top+b.height/2,0,0,ini())},
    ajustar(){z.s=1;z.x=0;z.y=0;aplicar()},
    pan(dx,dy){if(z.s>1){z.x+=dx;z.y+=dy;limitar();aplicar()}},
    pinchIni(a,b){p0={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,i:ini()}},
    pinchMov(a,b){if(!p0)return;const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;poner(p0.i.s*d/p0.d,p0.mx,p0.my,mx-p0.mx,my-p0.my,p0.i)},
    pinchFin(){p0=null}}}
const cotasDe=r=>(r.anot||[]).filter(o=>o.t==='cota'&&o.s).map(o=>o.s);

/* ---- visor de foto a pantalla completa (zoom con pellizco, doble toque, botones) ---- */
function verFoto(blob,leyenda){
  const m=modal(`<div class="annbar"><b style="flex:1;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🔍 ${esc(leyenda||'Foto')}</b><button id="cx" class="on">Cerrar</button></div>
    <div class="annbox" id="bx"><img id="im" alt="" draggable="false" src="${urlDe(blob)}" style="max-width:100%;max-height:100%;touch-action:none">
      <div class="zbtns"><button id="zi" aria-label="Acercar">＋</button><button id="zo" aria-label="Alejar">−</button><button id="zf" aria-label="Ajustar">⤢</button></div></div>`,{full:true});
  const box=m.$('#bx'),im=m.$('#im'),zm=motorZoom(box,im);
  const ptrs=new Map();let pinch=false,movio=false,ini=null,ultTap=0;
  box.addEventListener('pointerdown',e=>{if(e.target.closest('.zbtns'))return;e.preventDefault();
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){pinch=true;const [a,b]=[...ptrs.values()];zm.pinchIni(a,b)}
    else if(ptrs.size===1){ini={x:e.clientX,y:e.clientY};movio=false;box.setPointerCapture(e.pointerId)}});
  box.addEventListener('pointermove',e=>{const q=ptrs.get(e.pointerId);if(!q)return;
    const dx=e.clientX-q.x,dy=e.clientY-q.y;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ini&&Math.hypot(e.clientX-ini.x,e.clientY-ini.y)>8)movio=true;
    if(pinch){if(ptrs.size>=2){const [a,b]=[...ptrs.values()];zm.pinchMov(a,b)}return}
    zm.pan(dx,dy)});
  const fin=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(pinch){if(!ptrs.size){pinch=false;zm.pinchFin()}return}
    if(!movio&&e.type==='pointerup'){const t=Date.now();
      if(t-ultTap<320){zm.z.s>1.05?zm.ajustar():zm.zoom(2.5,e.clientX,e.clientY);ultTap=0}else ultTap=t}};
  box.addEventListener('pointerup',fin);box.addEventListener('pointercancel',fin);
  m.$('#zi').onclick=()=>zm.zoom(1.5);m.$('#zo').onclick=()=>zm.zoom(1/1.5);m.$('#zf').onclick=()=>zm.ajustar();
  m.$('#cx').onclick=()=>m.cerrar()}

/* ---- anotador: lápiz, flecha, cota (acotador), círculo, texto, mover, ver/zoom ---- */
async function anotar(r){
  const baseBlob=r.fondo||(r.anot?r.orig:r.blob);   // imagen sin las anotaciones editables
  const img=await cargarImg(baseBlob);const [W,H]=dimsImg(img);
  const m=modal(`
    <div class="annbar"><button data-t="lapiz" class="on">✏️ Lápiz</button><button data-t="flecha">➚ Flecha</button><button data-t="cota">📐 Cota</button><button data-t="circ">◯ Círculo</button><button data-t="texto">T Texto</button><button data-t="mover">✋ Mover</button><button data-t="ver">🔍 Ver</button>
      <span style="flex:1"></span>
      <button class="col on" data-c="#ff1744" style="background:#ff1744"></button><button class="col" data-c="#ffd600" style="background:#ffd600"></button><button class="col" data-c="#ffffff" style="background:#fff"></button></div>
    <div class="annbox" id="bx"><canvas id="cv" width="${W}" height="${H}"></canvas>
      <div class="zbtns"><button id="zi" aria-label="Acercar">＋</button><button id="zo" aria-label="Alejar">−</button><button id="zf" aria-label="Ajustar">⤢</button></div></div>
    <div class="annbar"><button id="un" aria-label="Deshacer" title="Deshacer">↶</button><button id="cl">Limpiar</button><button id="bo" aria-label="Borrar la anotación seleccionada" title="Borrar la seleccionada">🗑</button><span style="flex:1"></span><button id="ca">Cancelar</button><button id="sv" class="on">Guardar</button></div>`,{full:true});
  const cv=m.$('#cv'),box=m.$('#bx'),x=cv.getContext('2d');
  const zm=motorZoom(box,cv);
  let tool='lapiz',color='#ff1744',ops=JSON.parse(JSON.stringify(r.anot||[])),act=null,sel=null,mv=null;
  const lw=Math.max(4,Math.round(W/190));
  const TOL=()=>Math.max(W/120,W/30/zm.z.s);            // zona de toque, constante en pantalla aunque haya zoom
  const clon=o=>JSON.parse(JSON.stringify(o));
  const cabeza=(t,g,L)=>{x.beginPath();x.moveTo(t[0],t[1]);x.lineTo(t[0]-L*Math.cos(g-.45),t[1]-L*Math.sin(g-.45));x.lineTo(t[0]-L*Math.cos(g+.45),t[1]-L*Math.sin(g+.45));x.closePath();x.fill()};
  const etiqueta=o=>{   // posición del texto de una cota: sobre la línea y siempre legible
    const ang=Math.atan2(o.b[1]-o.a[1],o.b[0]-o.a[0]);let nx=-Math.sin(ang),ny=Math.cos(ang);if(ny>0){nx=-nx;ny=-ny}
    let ta=ang;if(ta>Math.PI/2)ta-=Math.PI;if(ta<-Math.PI/2)ta+=Math.PI;
    const off=o.fs*.75+o.w*3;x.font=`bold ${o.fs}px sans-serif`;
    return {px:(o.a[0]+o.b[0])/2+nx*off,py:(o.a[1]+o.b[1])/2+ny*off,ang:ta,w:o.s?x.measureText(o.s).width:0}};
  const dib=o=>{x.strokeStyle=o.c;x.fillStyle=o.c;x.lineWidth=o.w;x.lineCap='round';x.lineJoin='round';
    if(o.t==='lapiz'){x.beginPath();o.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()}
    else if(o.t==='flecha'){const a=o.a,b=o.b;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();cabeza(b,Math.atan2(b[1]-a[1],b[0]-a[0]),o.w*5)}
    else if(o.t==='cota'){
      const [ax,ay]=o.a,[bx,by]=o.b,ang=Math.atan2(by-ay,bx-ax),nx=-Math.sin(ang),ny=Math.cos(ang),T=o.w*4.5;
      x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();                      // línea de cota
      x.beginPath();x.moveTo(ax-nx*T,ay-ny*T);x.lineTo(ax+nx*T,ay+ny*T);x.moveTo(bx-nx*T,by-ny*T);x.lineTo(bx+nx*T,by+ny*T);x.stroke(); // topes
      cabeza(o.b,ang,o.w*4.5);cabeza(o.a,ang+Math.PI,o.w*4.5);                       // puntas hacia afuera
      if(o.s){const e=etiqueta(o);x.save();x.translate(e.px,e.py);x.rotate(e.ang);x.textAlign='center';x.textBaseline='middle';
        x.font=`bold ${o.fs}px sans-serif`;x.lineWidth=o.fs/6;x.strokeStyle='#000';x.strokeText(o.s,0,0);x.fillStyle=o.c;x.fillText(o.s,0,0);x.restore()}}
    else if(o.t==='circ'){x.beginPath();x.ellipse((o.a[0]+o.b[0])/2,(o.a[1]+o.b[1])/2,Math.abs(o.b[0]-o.a[0])/2||1,Math.abs(o.b[1]-o.a[1])/2||1,0,0,Math.PI*2);x.stroke()}
    else if(o.t==='texto'){x.font=`bold ${o.fs}px sans-serif`;x.textBaseline='top';x.textAlign='left';x.lineWidth=o.fs/6;x.strokeStyle='#000';x.strokeText(o.s,o.p[0],o.p[1]);x.fillText(o.s,o.p[0],o.p[1])}};
  const caja=o=>{
    if(o.t==='texto'){x.font=`bold ${o.fs}px sans-serif`;return [o.p[0],o.p[1],o.p[0]+x.measureText(o.s).width,o.p[1]+o.fs]}
    if(o.t==='cota'){const e=etiqueta(o),hw=Math.max(e.w/2,o.fs),xs=[o.a[0],o.b[0],e.px-hw,e.px+hw],ys=[o.a[1],o.b[1],e.py-o.fs,e.py+o.fs];return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
    if(o.t==='circ'||o.t==='flecha')return [Math.min(o.a[0],o.b[0]),Math.min(o.a[1],o.b[1]),Math.max(o.a[0],o.b[0]),Math.max(o.a[1],o.b[1])];
    const xs=o.pts.map(q=>q[0]),ys=o.pts.map(q=>q[1]);return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]};
  const dseg=(p,a,b)=>{const vx=b[0]-a[0],vy=b[1]-a[1],l=vx*vx+vy*vy||1;let t=((p[0]-a[0])*vx+(p[1]-a[1])*vy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*vx,p[1]-a[1]-t*vy)};
  const golpea=(o,p)=>{const tol=TOL();
    if(o.t==='flecha')return dseg(p,o.a,o.b)<tol;
    if(o.t==='cota'){if(dseg(p,o.a,o.b)<tol)return true;if(!o.s)return false;const e=etiqueta(o);return Math.hypot(p[0]-e.px,p[1]-e.py)<Math.max(o.fs,e.w/2+tol/2)}
    if(o.t==='lapiz')return o.pts.some((q,i)=>dseg(p,q,o.pts[i+1]||q)<tol);
    const c=caja(o);return p[0]>=c[0]-tol&&p[0]<=c[2]+tol&&p[1]>=c[1]-tol&&p[1]<=c[3]+tol};
  const mover=(o,b,dx,dy,modo)=>{
    if(modo){o[modo]=[b[modo][0]+dx,b[modo][1]+dy];return}   // arrastrar solo una punta
    if(o.t==='texto')o.p=[b.p[0]+dx,b.p[1]+dy];
    else if(o.t==='lapiz')o.pts=b.pts.map(q=>[q[0]+dx,q[1]+dy]);
    else{o.a=[b.a[0]+dx,b.a[1]+dy];o.b=[b.b[0]+dx,b.b[1]+dy]}};
  const pintar=()=>{x.drawImage(img,0,0,W,H);ops.forEach(dib);if(act)dib(act);
    if(sel){const c=caja(sel),g=TOL()/3;x.save();x.setLineDash([W/60,W/90]);x.lineWidth=Math.max(2,W/400);x.strokeStyle='#ffc400';x.strokeRect(c[0]-g,c[1]-g,c[2]-c[0]+2*g,c[3]-c[1]+2*g);
      if(sel.t==='cota'||sel.t==='flecha'){x.setLineDash([]);x.fillStyle='#ffc400cc';x.strokeStyle='#000';x.lineWidth=Math.max(2,W/500);
        [sel.a,sel.b].forEach(q=>{x.beginPath();x.arc(q[0],q[1],TOL()/2.2,0,Math.PI*2);x.fill();x.stroke()})}
      x.restore()}};
  const pt=e=>{const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]};
  const dentro=e=>{const b=cv.getBoundingClientRect();return e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom};

  /* editor de texto / medida de cota: escribir, unidad, tamaño, eliminar */
  const editarTexto=(o,p)=>{
    const nuevo=!o,cota=!!o&&o.t==='cota';
    const titulo=nuevo?'Texto sobre la foto':cota?(o.s?'Editar medida':'Escribe la medida'):'Editar texto';
    const ult=aj().cotaU||'';
    const t=modal(`<h2>${titulo}</h2>
      <div style="display:flex;gap:8px"><input class="in" id="tx" value="${esc(o?o.s:'')}" placeholder="${cota?'Ej.: 1,20':'Ej.: fisura'}" autocomplete="off"${cota?' inputmode="decimal"':''}>${cota?'<button class="btn" id="kb" style="flex:none;min-width:64px">ABC</button>':''}</div>
      ${cota?`<div class="chips" id="un2">${['mm','cm','m','in'].map(q=>`<button type="button" class="chip${q===ult?' on':''}" data-u="${q}">${q}</button>`).join('')}</div>`:''}
      ${nuevo?'':'<div class="row" style="margin-top:10px"><button class="btn" id="mn">A− más chico</button><button class="btn" id="mp">A+ más grande</button></div>'}
      <div class="row">${nuevo?'':'<button class="btn dan" id="el">Eliminar</button>'}<button class="btn" id="c">Cancelar</button><button class="btn pri" id="ok">${nuevo?'Poner':'Guardar'}</button></div>`);
    const tx=t.$('#tx');tx.focus();tx.select();
    tx.addEventListener('keydown',e=>{if(e.key==='Enter')t.$('#ok').click()});
    t.$('#c').onclick=()=>t.cerrar();
    if(cota){
      t.$('#un2').addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(!b)return;
        const v=tx.value.trim().replace(/\s*(mm|cm|m|in)$/i,'');tx.value=(v?v+' ':'')+b.dataset.u;setAj({cotaU:b.dataset.u});
        t.querySelectorAll('#un2 .chip').forEach(z=>z.classList.toggle('on',z===b));tx.focus()});
      t.$('#kb').onclick=()=>{const dec=tx.inputMode==='decimal';tx.inputMode=dec?'text':'decimal';t.$('#kb').textContent=dec?'123':'ABC';tx.blur();tx.focus()}}
    if(!nuevo){
      t.$('#mn').onclick=()=>{o.fs=Math.max(Math.round(W/80),Math.round(o.fs/1.2));pintar()};
      t.$('#mp').onclick=()=>{o.fs=Math.min(Math.round(W/5),Math.round(o.fs*1.2));pintar()};
      t.$('#el').onclick=()=>{ops.splice(ops.indexOf(o),1);sel=null;t.cerrar();pintar()}}
    t.$('#ok').onclick=()=>{const v=tx.value.trim();if(!v&&!cota){toast('Escribe un texto');return}
      t.cerrar();
      if(nuevo){const n={t:'texto',c:color,p,s:v,fs:Math.round(W/26)};ops.push(n);sel=n;tool='mover';
        m.querySelectorAll('[data-t]').forEach(z=>z.classList.toggle('on',z.dataset.t==='mover'));toast('Arrastra para mover · toca para editar')}
      else o.s=v;
      pintar()}};

  pintar();
  m.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.t){tool=b.dataset.t;m.querySelectorAll('[data-t]').forEach(z=>z.classList.toggle('on',z===b))}
    if(b.dataset.c){color=b.dataset.c;m.querySelectorAll('[data-c]').forEach(z=>z.classList.toggle('on',z===b));if(sel){sel.c=color;pintar()}}});
  m.$('#zi').onclick=()=>zm.zoom(1.5);m.$('#zo').onclick=()=>zm.zoom(1/1.5);m.$('#zf').onclick=()=>zm.ajustar();

  /* ---- gestos: 1 dedo = herramienta, 2 dedos = zoom y desplazamiento ---- */
  const ptrs=new Map();let gesto=false,pan=null;
  box.addEventListener('pointerdown',e=>{
    if(e.target.closest('.zbtns'))return;
    e.preventDefault();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){gesto=true;act=null;if(mv){mover(sel,mv.base,0,0,mv.modo);mv=null}pan=null;const [a,b]=[...ptrs.values()];zm.pinchIni(a,b);pintar();return}
    if(ptrs.size>2||gesto)return;
    box.setPointerCapture(e.pointerId);
    if(tool==='ver'){pan={x:e.clientX,y:e.clientY};return}
    if(!dentro(e))return;
    const p=pt(e);
    if(tool==='mover'){
      if(sel&&(sel.t==='cota'||sel.t==='flecha')){   // ¿tocó una punta de la anotación seleccionada?
        const h=['a','b'].find(k=>Math.hypot(p[0]-sel[k][0],p[1]-sel[k][1])<TOL()*1.3);
        if(h){mv={base:clon(sel),p0:p,modo:h,movido:false};pintar();return}}
      const o=[...ops].reverse().find(z=>golpea(z,p));
      if(o){sel=o;mv={base:clon(o),p0:p,movido:false}}else sel=null;
      pintar();return}
    sel=null;
    if(tool==='texto'){editarTexto(null,p);return}
    const base={t:tool,c:color,w:lw,pts:[p],a:p,b:p};
    if(tool==='cota')base.fs=Math.round(W/32),base.s='';
    act=base;pintar()});
  box.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(gesto){if(ptrs.size>=2){const [a,b]=[...ptrs.values()];zm.pinchMov(a,b)}return}
    if(pan){zm.pan(e.clientX-pan.x,e.clientY-pan.y);pan={x:e.clientX,y:e.clientY};return}
    const p=pt(e);
    if(mv){const dx=p[0]-mv.p0[0],dy=p[1]-mv.p0[1];if(Math.hypot(dx,dy)>TOL()/2)mv.movido=true;if(mv.movido){mover(sel,mv.base,dx,dy,mv.modo);pintar()}return}
    if(!act)return;if(act.t==='lapiz')act.pts.push(p);act.b=p;pintar()});
  const fin=cancel=>{
    if(mv){const tocar=!cancel&&!mv.movido&&sel&&(sel.t==='texto'||sel.t==='cota');mv=null;if(tocar)editarTexto(sel);return}
    if(!act)return;const o=act;act=null;
    if(cancel){pintar();return}
    if(o.t==='lapiz'&&o.pts.length<2){pintar();return}
    if(o.t!=='lapiz'&&Math.hypot(o.b[0]-o.a[0],o.b[1]-o.a[1])<TOL()/2){pintar();return}   // un toque sin arrastrar no crea nada
    ops.push(o);
    if(o.t==='cota'){sel=o;pintar();editarTexto(o);return}
    pintar()};
  const soltar=cancel=>e=>{
    if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(gesto){if(!ptrs.size){gesto=false;zm.pinchFin()}return}
    pan=null;fin(cancel)};
  box.addEventListener('pointerup',soltar(false));box.addEventListener('pointercancel',soltar(true));

  m.$('#un').onclick=()=>{ops.pop();sel=null;pintar()};
  m.$('#cl').onclick=()=>{ops=[];sel=null;pintar()};
  m.$('#bo').onclick=()=>{if(!sel){toast('Con ✋ Mover, toca la anotación que quieres borrar');return}ops.splice(ops.indexOf(sel),1);sel=null;pintar()};
  const volver=()=>{m.cerrar();recargar().then(()=>{renderVisita();const rr=S.regs.find(z=>z.id===r.id);if(rr)formRegistro(rr,false)})};
  m.$('#ca').onclick=volver;
  m.$('#sv').onclick=async()=>{
    sel=null;pintar();
    if(ops.length){
      if(r.orig&&!r.anot&&!r.fondo)r.fondo=r.blob;      // anotaciones de versiones anteriores quedan como fondo
      r.orig=r.orig||r.blob;
      r.anot=JSON.parse(JSON.stringify(ops));
      r.blob=await aBlob(cv,.85);r.thumb=await thumbDe(cv);await put('registros',r)}
    else if(r.anot&&r.anot.length){                      // se borraron todas las anotaciones
      const limpio=r.fondo||r.orig;
      if(r.fondo)delete r.fondo;else delete r.orig;
      delete r.anot;r.blob=limpio;r.thumb=await thumbDe(await canvasDe(limpio));await put('registros',r)}
    volver()};
}

/* ============ menú de la visita, exportaciones ============ */
function menuVisita(){

  const m=modal(`<div class="menu">

    <button data-m="ed">✏️ Datos de la visita</button>
    <button data-m="del" class="dan">🗑️ Eliminar visita</button>
    <button data-m="x">Cerrar</button></div>`,{fuera:true});
  m.addEventListener('click',async e=>{const k=e.target.closest('[data-m]')?.dataset.m;if(!k)return;m.cerrar();
    if(k==='inf')renderInforme();
    if(k==='csv')exportarCSV();
    if(k==='fot')compartirFotos();
    if(k==='resp')respaldo([S.visita.id]);
    if(k==='vf'){const nv=!aj().vozFoto;setAj({vozFoto:nv});toast('Audio tras cada foto '+(nv?'activado':'desactivado'))}
    if(k==='rot'){setAj({rotular:!rot});toast('Rótulo '+(!rot?'activado':'desactivado'))}
    if(k==='ed')formVisita(S.visita);
    if(k==='del'&&confirm(`¿Eliminar «${S.visita.nombre}» con sus ${S.regs.length} registros? No se puede deshacer.`)){
      await borrarVisita(S.visita.id);history.back();toast('Visita eliminada')}})}

function descargar(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},5000)}
const slug=s=>String(s||'').normalize('NFC').replace(/[^\p{L}\p{N}]+/gu,'_').replace(/^_|_$/g,'');
function exportarCSV(){
  const c=s=>{s=String(s??'');return /[";\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const f=[['Visita','Sector','Elemento','Tipo','Descripción','Medido','Nominal','Diferencia','Unidad','Severidad','Fecha','Hora','Latitud','Longitud','Precisión (m)','Cotas']];
  const co=n=>n==null?'':n.toFixed(6).replace('.',',');
  [...S.regs].sort((a,b)=>a.ts-b.ts).forEach(r=>{
    const d=delta(r);
    f.push([S.visita.nombre,r.sector,r.elemento,r.tipo,r.tipo==='medida'?r.etiqueta+(r.texto?' ('+r.texto+')':''):(r.texto||(r.tipo==='voz'?'Nota de voz ('+fmtDur(r.dur)+', audio en la app)':r.tipo==='foto'?'Foto':'')),r.valor||'',r.nominal||'',d?fmtN(d.d):'',r.unidad||'',r.severidad||'',fmtF(r.ts),fmtH(r.ts),co(r.lat),co(r.lng),r.acc!=null?Math.round(r.acc):'',cotasDe(r).join(' | ')]);});
  descargar(new Blob(['﻿'+f.map(r=>r.map(c).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`${slug(S.visita.nombre)}.csv`)}
async function compartirFotos(){
  const fs=[...S.regs].filter(r=>r.blob).sort((a,b)=>a.ts-b.ts);if(!fs.length){toast('No hay fotos');return}
  const files=fs.map(r=>new File([r.blob],`${slug(r.sector)}_${slug(r.elemento)||'-'}_${stamp(r.ts)}.jpg`,{type:'image/jpeg'}));
  if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,title:S.visita.nombre})}catch(e){}}
  else{files.forEach((f,i)=>setTimeout(()=>descargar(f,f.name),i*500));toast('Descargando fotos…')}}

/* ---- respaldo ---- */
const aDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function respaldo(ids){
  toast('Preparando respaldo…');
  const vs=(await getAll('visitas')).filter(v=>!ids||ids.includes(v.id));
  const out={app:'terreno',version:1,fecha:Date.now(),visitas:[]};
  for(const v of vs){const rs=[];for(const r of await regsDe(v.id)){const o={...r};for(const k of ['blob','thumb','orig','audio','fondo'])if(o[k])o[k]=await aDataURL(o[k]);rs.push(o)}out.visitas.push({visita:v,registros:rs})}
  const nombre=ids&&vs.length===1?slug(vs[0].nombre):'todas';
  const b=new Blob([JSON.stringify(out)],{type:'application/json'});
  const f=new File([b],`terreno-respaldo-${nombre}-${stamp(Date.now())}.json`,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Respaldo Terreno'});return}catch(e){if(e.name==='AbortError')return}}
  descargar(f,f.name);toast('Respaldo descargado')}
$('#imp').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=='terreno')throw 0;let n=0;
    for(const {visita,registros} of j.visitas){await put('visitas',visita);
      for(const r of registros){for(const k of ['blob','thumb','orig','audio','fondo'])if(r[k])r[k]=await (await fetch(r[k])).blob();await put('registros',r);n++}}
    toast(`Importadas ${j.visitas.length} visita(s)`);renderHome()}
  catch(err){toast('Ese archivo no es un respaldo válido')}});

/* ============ informe ============ */
function renderInforme(){
  entrarNivel();liberarUrls();
  const v=S.visita,a=aj();const rs=[...S.regs].sort((x,y)=>x.ts-y.ts);
  const sectores=[...new Set(rs.map(r=>r.sector||'(sin sector)'))];
  const hall=rs.filter(r=>r.tipo==='hallazgo');
  const tabla=(c,filas)=>`<table><tr>${c.map(x=>`<th>${x}</th>`).join('')}</tr>${filas.join('')}</table>`;
  let h=`<div class="doc"><h1>Informe de visita a terreno</h1>
    <table class="meta"><tr><td>Visita</td><td>${esc(v.nombre)}</td></tr><tr><td>Proyecto / faena</td><td>${esc(v.proyecto||'—')}</td></tr>
    <tr><td>Responsable</td><td>${esc(v.responsable||a.responsable||'—')}${a.empresa?' · '+esc(a.empresa):''}</td></tr>
    <tr><td>Fecha</td><td>${fmtF(v.fecha)}</td></tr>
    <tr><td>Registros</td><td>${rs.filter(r=>r.tipo==='foto'||r.blob).length} fotos · ${rs.filter(r=>r.tipo==='medida').length} medidas · ${hall.length} hallazgos · ${rs.filter(r=>r.tipo==='nota').length} notas · ${rs.filter(r=>r.tipo==='voz').length} notas de voz</td></tr></table>`;
  if(hall.length)h+=`<h2>Resumen de hallazgos</h2>`+tabla(['Sev.','Sector › Elemento','Descripción'],[...hall].sort((x,y)=>SEV.indexOf(y.severidad)-SEV.indexOf(x.severidad)).map(r=>`<tr><td>${esc(r.severidad)}</td><td>${esc(r.sector)}${r.elemento?' › '+esc(r.elemento):''}</td><td>${esc(r.texto)}</td></tr>`));
  for(const s of sectores){
    h+=`<h2>${esc(s)}</h2>`;
    const rsS=rs.filter(r=>(r.sector||'(sin sector)')===s);
    for(const e of [...new Set(rsS.map(r=>r.elemento||''))]){
      const re=rsS.filter(r=>(r.elemento||'')===e);
      h+=`<h3>${e?esc(e):'Sin elemento específico'}</h3>`;
      const med=re.filter(r=>r.tipo==='medida');
      if(med.length)h+=tabla(['Medición','Medido','Nominal','Dif.','Un.','Hora'],med.map(r=>`<tr><td>${esc(r.etiqueta)}${r.texto?'<br><small>'+esc(r.texto)+'</small>':''}</td><td class="n">${esc(r.valor)}</td><td class="n">${esc(r.nominal||'—')}</td><td class="n">${esc(deltaTxt(r).replace('Δ ',''))||'—'}</td><td>${esc(r.unidad)}</td><td>${fmtH(r.ts)}</td></tr>`));
      const hz=re.filter(r=>r.tipo==='hallazgo');
      if(hz.length)h+=tabla(['Hallazgo','Severidad','Hora'],hz.map(r=>`<tr><td>${esc(r.texto)}</td><td>${esc(r.severidad)}</td><td>${fmtH(r.ts)}</td></tr>`));
      const nt=re.filter(r=>r.tipo==='nota');
      if(nt.length)h+=tabla(['Notas','Hora'],nt.map(r=>`<tr><td>${esc(r.texto)}</td><td>${fmtH(r.ts)}</td></tr>`));
      const vz=re.filter(r=>r.tipo==='voz');
      if(vz.length)h+=tabla(['Notas de voz (el audio queda en la app)','Duración','Hora'],vz.map(r=>`<tr><td>${esc(r.texto||'Sin leyenda')}</td><td>${fmtDur(r.dur)}</td><td>${fmtH(r.ts)}</td></tr>`));
      const fo=re.filter(r=>r.blob);
      if(fo.length)h+=`<div class="grid">${fo.map(r=>`<figure class="fig"><img src="${urlDe(r.blob)}" alt=""><figcaption>${r.tipo==='hallazgo'?'⚠ '+esc(r.severidad)+' · ':''}${fmtH(r.ts)}${r.texto?' · '+esc(r.texto):''}${cotasDe(r).length?' · 📐 Cotas: '+cotasDe(r).map(esc).join('; '):''}${r.audio?' · 🎙 audio '+fmtDur(r.dur)+' (en la app)':''}${r.lat!=null?` · ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}`:''}</figcaption></figure>`).join('')}</div>`;
    }}
  if(!rs.length)h+=`<p class="mut">Esta visita aún no tiene registros.</p>`;
  h+='</div>';
  app().innerHTML=`<div class="bar no-print"><button class="ib" data-a="volver" aria-label="Volver">←</button><h1>Informe</h1><button class="btn pri" data-a="imprimir" style="min-height:40px;padding:8px 14px">Guardar PDF</button></div><div class="wrap">${h}</div>`;
  scrollTo(0,0)}

/* ============ eventos ============ */
const ACC={
  menuHome,nuevaVisita:()=>formVisita(),
  abrir:t=>abrirVisita(t.dataset.id),
  volver:()=>history.back(),
  ctx:()=>abrirCtx(),foto:pedirFoto,medida:nuevaMedida,nota:nuevaNota,voz:()=>grabarVoz(),vozreg:t=>{const r=S.regs.find(x=>x.id===t.dataset.id);if(r)grabarVoz({reg:r})},hallazgo:nuevoHallazgo,
  filtro:t=>{S.filtro=t.dataset.f;renderVisita()},
  reg:t=>abrirReg(t.dataset.id),menuVisita,
  imprimir:()=>{try{window.print()}catch(e){toast('Usa el menú del navegador → Imprimir')}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&ACC[t.dataset.a])ACC[t.dataset.a](t,e)});

const msgError=er=>/quota/i.test((er&&er.name)+' '+(er&&er.message))?'Almacenamiento lleno: libera espacio o haz un respaldo':'No se pudo completar la acción. Intenta de nuevo';
addEventListener('unhandledrejection',e=>{console.error(e.reason);toast(msgError(e.reason))});
addEventListener('error',e=>{console.error(e.error||e.message);toast(msgError(e.error))});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.instalar=e});
addEventListener('appinstalled',()=>{S.instalar=null});

/* ============ arranque ============ */
(async()=>{
  try{db=await abrirDB()}
  catch(e){app().innerHTML='<div class="wrap"><div class="card"><b>No se puede guardar datos en este navegador.</b><br>Abre la app en Chrome (no en modo incógnito).</div></div>';return}
  history.replaceState({n:0},'');
  await renderHome();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.ready.then(()=>{S.offline=true;if(S.nivel===0&&!modales.length)renderHome()}).catch(()=>{})}
})();
</script>
